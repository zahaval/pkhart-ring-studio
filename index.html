<!--
  PK HART — BIRTHSTONE RING STUDIO (concept demo, v2 — photoreal)
  Sibling of the Ear Stack Studio: a custom ring designer for PK HART's stacked
  birthstone rings (one thin band per person; optional feature diamond band).

  v2 renders the ring in real time with three.js PBR materials — studio
  environment lighting, metallic bands, refractive stones — styled like the
  store's own product photography (piece standing on seamless ivory).

  Still true (see BRIEF.md):
    - runs from a static folder, no CDNs (three.js is vendored in ./vendor)
    - nothing sends anywhere: "Request this design" opens the visitor's own
      mail client via mailto:, everything else stays on the page.
-->

<style>
/* ============================ PK HART — STUDIO ============================
   Quiet product page: pure white, black ink, one classic serif for the name,
   small spaced capitals for labels. Square edges, hairlines, no shadows. */
:root{
  --ink:#0B0B0B; --ink-2:#4A4A4A; --ink-3:#8A8A8A;
  --paper:#FFFFFF; --mist:#F5F5F5; --line-c:#E6E6E6; --line-2:#CCCCCC;
  --serif:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --sans:'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --ease:cubic-bezier(.2,.7,.3,1); --fast:160ms;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; text-rendering:optimizeLegibility}
h1,h2{font-family:var(--serif); font-weight:400; margin:0; font-variant-numeric:lining-nums}
button,input,select{font-family:var(--sans); color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none !important; animation:none !important} }
[hidden]{display:none !important}

/* ============================ NAV ============================ */
.nav{display:flex; align-items:center; justify-content:space-between; padding:22px 48px; border-bottom:1px solid var(--line-c)}
.wordmark{font-family:var(--serif); font-size:22px; letter-spacing:.22em; color:var(--ink); text-decoration:none}
.navlink{font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--ink); text-decoration:none}
.navlink:hover{text-decoration:underline; text-underline-offset:4px}

/* ============================ BUTTONS ============================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:0;
  padding:14px 20px; font-size:11.5px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; line-height:1.2; white-space:nowrap;
  text-decoration:none; transition:background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.btn:hover{background:var(--ink); color:#fff}
.btn.gold{background:var(--ink); color:#fff}
.btn.gold:hover{background:#333; border-color:#333}
.btn.quiet{border-color:var(--line-2)}
.btn.sm{padding:8px 12px; font-size:10px}
.btn.wide{width:100%}
.link{
  border:0; background:none; padding:0; font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-2); text-decoration:underline; text-decoration-color:transparent; text-underline-offset:4px;
  transition:color var(--fast) var(--ease), text-decoration-color var(--fast) var(--ease);
}
.link:hover{color:var(--ink); text-decoration-color:var(--ink)}
.link:disabled{opacity:.35; cursor:default; text-decoration:none}

/* ============================ LAYOUT ============================ */
.studio{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr); min-height:calc(100vh - 70px)}
.stage-col{display:flex; flex-direction:column; padding:32px 40px 24px 48px; border-right:1px solid var(--line-c)}
.panel{padding:44px 48px 48px 44px; max-width:560px}
@media (min-width:981px){ .stage-col{position:sticky; top:0; height:100vh; max-height:860px} }

/* ============================ STAGE ============================ */
.stage{flex:1; position:relative; min-height:420px; overflow:hidden; background:#fff}
.stage canvas#scene{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
.stage-btns{position:absolute; right:0; bottom:0; display:flex; gap:8px}
.viewseg{position:absolute; left:0; top:0; z-index:3; display:flex; gap:20px}
.viewseg button{border:0; border-bottom:1px solid transparent; background:transparent; padding:4px 0; font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3)}
.viewseg button:hover{color:var(--ink)}
.viewseg button[aria-pressed=true]{color:var(--ink); border-bottom-color:var(--ink)}
.photo{position:absolute; inset:0; margin:0; background:#fff; display:none; z-index:2; align-items:center; justify-content:center}
.stage.is-photo .photo{display:flex}
.stage.is-photo .stage-btns{display:none}
.photo canvas{display:block; width:300px; height:300px}
.stage-foot{display:flex; gap:28px; justify-content:center; padding-top:16px}

/* ============================ PANEL ============================ */
.panel h1{font-size:44px; line-height:1.05; letter-spacing:.005em}
.lede{margin:10px 0 0; color:var(--ink-2); font-size:14px}
.opt{border-top:1px solid var(--line-c); margin-top:28px; padding-top:20px}
.panel h1 + .lede + .opt{margin-top:32px}
.opt-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase}
.opt-h .val{letter-spacing:.04em; text-transform:none; font-size:13px; font-weight:400; color:var(--ink-2)}
.opt-h .val:empty{display:none}
.add{margin-top:12px}

/* metal swatches */
.metals{display:flex; gap:14px}
.metal{
  width:34px; height:34px; border-radius:50%; border:0; padding:0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.10); outline:1px solid transparent; outline-offset:4px;
  transition:outline-color var(--fast) var(--ease);
}
.metal:hover{outline-color:var(--line-2)}
.metal[aria-pressed=true]{outline-color:var(--ink)}
.metal.y{background:linear-gradient(140deg,#F3DCA0 0%,#D9B468 45%,#B48A3E 100%)}
.metal.r{background:linear-gradient(140deg,#F5D3C2 0%,#DDA88C 45%,#B8785B 100%)}
.metal.w{background:linear-gradient(140deg,#FBFBFC 0%,#D9DBE0 45%,#A9ACB4 100%)}

/* a wrap = one row: number, its stone strip, remove */
.bands{display:flex; flex-direction:column}
.wrap-row{display:grid; grid-template-columns:26px minmax(0,1fr) auto 20px; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-c)}
.strips{display:flex; flex-direction:column; gap:8px}
.twin-strip{padding-left:27px; position:relative}
.twin-strip::before{content:"+"; position:absolute; left:6px; top:50%; transform:translateY(-52%); font-size:13px; color:var(--ink-3)}
.twin-strip .stone{width:16px; height:16px}
.twin{border:1px solid var(--line-2); background:#fff; padding:5px 8px; font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2)}
.twin:hover{border-color:var(--ink); color:var(--ink)}
.twin[aria-pressed=true]{background:var(--ink); border-color:var(--ink); color:#fff}
.twin:disabled{opacity:.3; cursor:default}
.wrap-row:last-child{border-bottom:0}
.wrap-n{font-family:var(--serif); font-size:17px; font-variant-numeric:lining-nums}
.stones{display:grid; grid-template-columns:repeat(7, 18px); gap:7px 8px}
.stone{
  width:18px; height:18px; border-radius:50%; border:0; padding:0; position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); outline:1px solid transparent; outline-offset:3px;
  transition:outline-color var(--fast) var(--ease), transform var(--fast) var(--ease);
}
.stone:hover{transform:scale(1.12)}
.stone[aria-pressed=true]{outline-color:var(--ink)}
.stone.none{background:#fff}
.stone.none::after{content:""; position:absolute; left:3px; right:3px; top:50%; height:1px; background:var(--ink-3); transform:rotate(-45deg)}
.rm{border:0; background:none; color:var(--ink-3); font-size:17px; line-height:1; padding:0}
.rm:hover{color:var(--ink)}

/* rectangular pickers */
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{
  border:1px solid var(--line-2); background:var(--paper); padding:8px 12px; min-width:44px;
  font-size:12px; letter-spacing:.04em; transition:background var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink); border-color:var(--ink); color:#fff}
.seg button.ico{display:inline-flex; align-items:center; justify-content:center; padding:7px 10px}
.seg button svg{display:block}
.bstone{display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; padding:14px 0; border-bottom:1px solid var(--line-c)}
.bstone:last-child{border-bottom:0}
.bstone .rows{display:flex; flex-direction:column; gap:10px}
#bottomCount{margin-bottom:4px}

.buy{display:flex; flex-direction:column; gap:14px}
.sizebox{display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase}
.sizebox select{border:1px solid var(--line-2); border-radius:0; background:var(--paper); padding:9px 12px; font-size:14px; letter-spacing:0}
.minor{display:flex; gap:28px; margin-top:22px}

/* ============================ MODAL / LIGHTBOX ============================ */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; padding:24px; z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff; border:1px solid var(--ink); max-width:480px; width:100%; padding:32px; max-height:86vh; overflow:auto}
.modal h2{font-size:30px}
.spec{white-space:pre-wrap; background:var(--mist); padding:14px 16px; font-size:13px; margin:18px 0; line-height:1.65}
.modal .actions{display:flex; gap:8px; flex-wrap:wrap}
.lightbox{position:fixed; inset:0; background:rgba(0,0,0,.86); display:none; z-index:60; align-items:center; justify-content:center; padding:24px; cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:min(100%,1100px); max-height:84vh; display:block}
.lightbox .cap{position:absolute; left:24px; right:24px; bottom:20px; text-align:center; color:#fff; font-size:13px}

footer.pagefoot{border-top:1px solid var(--line-c); padding:22px 48px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}

/* ============================ PHONE ============================ */
@media (max-width:980px){
  .nav{padding:16px 20px}
  .studio{display:block}
  .stage-col{position:sticky; top:0; z-index:20; background:#fff; padding:10px 20px 10px; border-right:0; border-bottom:1px solid var(--line-c)}
  .stage{height:40vh; min-height:0}
  .stage-foot{padding-top:6px}
  .panel{padding:24px 20px 40px; max-width:none}
  .panel h1{font-size:34px}
  .stone{width:26px; height:26px}
  .stones{gap:9px}
  .seg button{padding:10px 14px}
  footer.pagefoot{padding:20px}
}
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

/* ============================ 1. DATA ============================ */
const MONTHS = [
  {m:'January',   s:'Garnet',     c:'#9A2A3A', d:'#5E1622', hex:0xb02a44},
  {m:'February',  s:'Amethyst',   c:'#9966CC', d:'#5E3A86', hex:0x9e66e0},
  {m:'March',     s:'Aquamarine', c:'#9BD8E0', d:'#5FA8B5', hex:0x9fe2ec},
  {m:'April',     s:'Diamond',    c:'#F2F5F9', d:'#B9C2CF', hex:0xffffff},
  {m:'May',       s:'Emerald',    c:'#2E9C6B', d:'#15573A', hex:0x1cc076},
  {m:'June',      s:'Pearl',      c:'#F6F1E7', d:'#CFC2A8', hex:0xf8f2e8},
  {m:'July',      s:'Ruby',       c:'#C3123F', d:'#7A0A26', hex:0xe0164a},
  {m:'August',    s:'Peridot',    c:'#AFCB54', d:'#779230', hex:0xbbdc50},
  {m:'September', s:'Sapphire',   c:'#2B4C9B', d:'#17295C', hex:0x2f5fd0},
  {m:'October',   s:'Opal',       c:'#EADCEE', d:'#C3A9CF', hex:0xf0e2f4},
  {m:'November',  s:'Citrine',    c:'#E8A83D', d:'#A66F1D', hex:0xf5b23a},
  {m:'December',  s:'Blue Topaz', c:'#58AEDC', d:'#2D6E99', hex:0x5cc0f0},
];
/* Warm 14k yellow like her ring (deeper than brass, bright polish), matched to the photo. */
const METALS = {
  y:{label:'Gold',      hex:0xdcab5a, rough:0.10},
  r:{label:'Rose gold', hex:0xdea28a, rough:0.10},
  w:{label:'Silver',    hex:0xe8e9ed, rough:0.08},
};
/* Her construction: 1–5 wraps, each with one birthstone or left plain.
   Stones cascade diagonally across the wraps (from her reference photos)
   and their placement is fixed — not draggable. */
const MAX_WRAPS = 5;
/* Measured from PK HART's own ring photo (0 = left of the face, 1 = right):
   wrap 1 .29 · wrap 2 .07 · wrap 3 .52 · wrap 4 .25 · wrap 5 .77, bottom stone .52.
   Compressed slightly (t = .10 + .80 x) so none slip over the shoulder. */
const PLACEMENT = [0.33, 0.16, 0.52, 0.30, 0.72];   // stone position per wrap
const SHAPES = [
  {id:'oval', label:'Oval'}, {id:'pear', label:'Pear'},
  {id:'heart', label:'Heart'}, {id:'emerald', label:'Emerald'},
];
/* Carat → rendered girdle size (round brilliant mm, scaled to the R=1 band). */
const STONE_CARATS = {
  c05:{label:'0.05 ct', scale:0.082},   // her size: ~2 mm, twice the wire's width
  c10:{label:'0.10 ct', scale:0.092},
  c15:{label:'0.15 ct', scale:0.112},
  c25:{label:'0.25 ct', scale:0.142},
};
const FEATURE_CARATS = {
  c50:{label:'0.50 ct', scale:0.20},
  c100:{label:'1 ct', scale:0.26},
  c150:{label:'1.5 ct', scale:0.30},
  c200:{label:'2 ct', scale:0.34},
};

/* ============================ 2. STATE ============================ */
let wraps = [];           // 1–5 of {id, stone: null | {month, name, twin}}
let metal = 'y';          // one metal for the whole ring
let stoneCarat = 'c15';   // one carat for all the top stones
let feature = {on:false, stones:[]};   // bottom wrap: up to 3 of {id, shape, month, size, name}
let selected = 0;         // wrap index, or 'f0'/'f1'/'f2' for bottom stones
let uid = 0;
// bottom stones sit together just off center, like her photos
const BOTTOM_POS = {1:[0.52], 2:[0.42,0.60], 3:[0.34,0.50,0.66]};
const MAX_BOTTOM = 3;

const twinMonth = st => (st.month2 == null ? st.month : st.month2);   // twins default to a matching stone
const stoneText = st => MONTHS[st.month].m + ' (' + MONTHS[st.month].s + ')' +
  (st.twin && twinMonth(st) !== st.month ? ' + ' + MONTHS[twinMonth(st)].m + ' (' + MONTHS[twinMonth(st)].s + ')' : '');
const swatchBg = mi => 'radial-gradient(circle at 32% 28%, rgba(255,255,255,.75) 0 10%, rgba(255,255,255,0) 38%), linear-gradient(150deg, ' + MONTHS[mi].c + ' 10%, ' + MONTHS[mi].d + ' 100%)';
function newWrap(partial){
  return Object.assign({id:++uid, stone:{month:3, name:'', twin:false}}, partial || {});
}
function newBottomStone(partial){
  return Object.assign({id:++uid, shape:'oval', month:3, size:'c100', name:'', turn:false}, partial || {});
}
function defaultDesign(){
  // Opens on Penina's own ring (see "Her ring, for reference"): ruby, garnet,
  // amethyst, peridot, citrine, and an emerald-cut diamond on the bottom wrap.
  wraps = [
    newWrap({stone:{month:6, name:'', twin:false}}),
    newWrap({stone:{month:0, name:'', twin:false}}),
    newWrap({stone:{month:1, name:'', twin:false}}),
    newWrap({stone:{month:7, name:'', twin:false}}),
    newWrap({stone:{month:10, name:'', twin:false}}),
  ];
  metal = 'y';
  stoneCarat = 'c05';
  feature = {on:true, stones:[newBottomStone({shape:'emerald', month:3, size:'c50', turn:true})]};
  selected = 0;
}

/* ============================ helpers ============================ */
const $ = (s, el) => (el||document).querySelector(s);
function h(tag, cls, parent, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* ============================ 3. CONTROLS ============================ */
function seg(items, current, onPick){
  const wrap = h('div', 'seg');
  for (const it of items){
    const b = h('button', it.icon ? 'ico' : '', wrap);
    b.type = 'button';
    if (it.icon) b.innerHTML = it.icon; else b.textContent = it.label;
    if (it.title){ b.title = it.title; b.setAttribute('aria-label', it.title); }
    b.setAttribute('aria-pressed', String(it.key === current));
    b.addEventListener('click', e => { e.stopPropagation(); onPick(it.key); });
  }
  return wrap;
}
function metalPicker(current, onPick){
  const wrap = h('div', 'metals');
  for (const key of ['y','r','w']){
    const b = h('button', 'metal ' + key, wrap);
    b.type = 'button';
    b.title = METALS[key].label;
    b.setAttribute('aria-label', METALS[key].label);
    b.setAttribute('aria-pressed', String(key === current));
    if (SWATCH.metals[key]) b.style.background = 'center / cover no-repeat url(' + SWATCH.metals[key] + ')';
    b.addEventListener('click', () => onPick(key));
  }
  return wrap;
}
function stoneStrip(current, onPick, withNone){
  const sw = h('div', 'stones');
  if (withNone){
    const b = h('button', 'stone none', sw);
    b.type = 'button'; b.title = 'No stone'; b.setAttribute('aria-label', 'No stone');
    b.setAttribute('aria-pressed', String(current == null));
    b.addEventListener('click', () => onPick(null));
  }
  MONTHS.forEach((mo, mi) => {
    const b = h('button', 'stone', sw);
    b.type = 'button';
    b.title = mo.m + ' · ' + mo.s;
    b.setAttribute('aria-label', mo.m + ' ' + mo.s);
    b.setAttribute('aria-pressed', String(current === mi));
    b.style.background = SWATCH.stones[mi] ? 'center / cover no-repeat url(' + SWATCH.stones[mi] + ')' : swatchBg(mi);
    b.addEventListener('click', () => onPick(mi));
  });
  return sw;
}

/* materials */
/* hand-finished surface: dense, tiny planishing facets under a high polish —
   enough to break the highlights into glints, not enough to read as texture */
const hammer = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0,0,256,256);
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 700; i++){
    const x = rnd()*256, y = rnd()*256, r = 3 + rnd()*7, v = 96 + rnd()*64;
    for (const ox of [-256,0,256]) for (const oy of [-256,0,256]){
      const gr = g.createRadialGradient(x+ox, y+oy, 0, x+ox, y+oy, r);
      gr.addColorStop(0, `rgba(${v},${v},${v},.5)`); gr.addColorStop(1, 'rgba(128,128,128,0)');
      g.fillStyle = gr; g.beginPath(); g.ellipse(x+ox, y+oy, r*1.4, r, rnd()*3, 0, 7); g.fill();
    }
  }

  return t;
})();
const metalMats = {};
for (const k in METALS){
  metalMats[k] = new THREE.MeshPhysicalMaterial({
    color:METALS[k].hex, metalness:1, roughness:METALS[k].rough,
    clearcoat:0.3, clearcoatRoughness:0.12, envMapIntensity:1.45,

// open seats are seen from inside too
const metalMatsDS = {};
for (const k in METALS){ metalMatsDS[k] = metalMats[k].clone(); metalMatsDS[k].side = THREE.DoubleSide; }
function gemMaterial(mi){
  const mo = MONTHS[mi];
  if (mo.s === 'Pearl') return new THREE.MeshPhysicalMaterial({
    color:mo.hex, metalness:0, roughness:0.22, clearcoat:1, clearcoatRoughness:0.12,
    iridescence:0.75, iridescenceIOR:1.5, envMapIntensity:1,
  });
  if (mo.s === 'Opal') return new THREE.MeshPhysicalMaterial({
    color:mo.hex, metalness:0, roughness:0.15, clearcoat:1,
    iridescence:1, iridescenceIOR:2, transmission:0.25, thickness:0.2, envMapIntensity:1.1,
  });
  const diamond = mo.s === 'Diamond';
  const mat = new THREE.MeshPhysicalMaterial({
    color:mo.hex, metalness:0, roughness:0.02,
    transmission:diamond ? 0.93 : 0.68, thickness:diamond ? 0.55 : 0.32,
    ior:diamond ? 2.35 : 1.9, clearcoat:1, clearcoatRoughness:0.03,
    attenuationColor:new THREE.Color(mo.hex), attenuationDistance:diamond ? 2 : 1.1,
    envMapIntensity:1.7,
  });
  if ('dispersion' in mat) mat.dispersion = diamond ? 0.35 : 0.12;
  return mat;

/* gem geometry: faceted cut built from a girdle outline */
function cutGeometry(outline, height){
  const rings = [
    {y: 0.38*height, s: 0.62},
    {y: 0.28*height, s: 0.92},
    {y: 0,           s: 1.00},
    {y:-0.26*height, s: 0.74},
    {y:-0.72*height, s: 0.10},
  ];
  const pos = [];
  const n = outline.length;
  const P = (ri, j) => {
    const [x, z] = outline[j % n];
    return [x*rings[ri].s, rings[ri].y, z*rings[ri].s];
  };
  // table cap (fan)
  for (let j = 0; j < n; j++){
    pos.push(0, rings[0].y, 0, ...P(0, j+1), ...P(0, j));
  }
  // side facets
  for (let ri = 0; ri < rings.length-1; ri++){
    for (let j = 0; j < n; j++){
      const a = P(ri, j), b = P(ri, j+1), c = P(ri+1, j+1), d = P(ri+1, j);
      pos.push(...a, ...b, ...c, ...a, ...c, ...d);
    }
  }
  // culet cap
  for (let j = 0; j < n; j++){
    pos.push(0, rings[4].y, 0, ...P(4, j), ...P(4, j+1));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
function circleOutline(n, rx, rz){
  const o = [];
  for (let i = 0; i < n; i++){
    const a = i/n * Math.PI*2;
    o.push([Math.cos(a)*rx, Math.sin(a)*rz]);
  }
  return o;
}
const OUTLINES = {
  round:   circleOutline(16, 1, 1),
  oval:    circleOutline(18, 0.74, 1.12),
  emerald: [[-0.5,-1.05],[0.5,-1.05],[0.78,-0.77],[0.78,0.77],[0.5,1.05],[-0.5,1.05],[-0.78,0.77],[-0.78,-0.77]],
  pear:    [[0,-1.15],[0.3,-0.68],[0.56,-0.22],[0.72,0.2],[0.74,0.52],[0.62,0.8],[0.36,0.98],[0,1.04],
            [-0.36,0.98],[-0.62,0.8],[-0.74,0.52],[-0.72,0.2],[-0.56,-0.22],[-0.3,-0.68]],
  heart:   [[0,1.05],[0.5,0.52],[0.82,0.08],[0.92,-0.32],[0.84,-0.62],[0.62,-0.8],[0.36,-0.76],[0.15,-0.58],[0,-0.36],
            [-0.15,-0.58],[-0.36,-0.76],[-0.62,-0.8],[-0.84,-0.62],[-0.92,-0.32],[-0.82,0.08],[-0.5,0.52]],
};
const GEOMS = {};
for (const k in OUTLINES) GEOMS[k] = cutGeometry(OUTLINES[k], 0.9);
const prongGeom = new THREE.SphereGeometry(1, 10, 8);

/* angle mapping: t in [0,1] -> theta across the visible top arc */
const TH0 = THREE.MathUtils.degToRad(152), TH1 = THREE.MathUtils.degToRad(28);
const tTheta = t => TH0 + (TH1 - TH0) * t;

/* Wraps fan apart across the top of the finger (where the stones live) and
   draw together at the back until they touch and fuse into one band — the
   way her rings are soldered. SPREAD_MIN sets how tight the bundle gets:
   at .17 the wires overlap each other by about a third at the back. */
const SPREAD_MIN = 0.15;
const spreadAt = th => SPREAD_MIN + (1 - SPREAD_MIN) * (1 + Math.sin(th)) / 2;
const spreadSlope = th => (1 - SPREAD_MIN) * Math.cos(th) / 2;
const tubeAt = th => 0.80 + 0.20 * (1 + Math.sin(th)) / 2;   // wire stays near-constant gauge

/* Each wire is hand-fanned, so it leans a little off parallel across the face
   and crosses its neighbours' line slightly — the lean dies out at the join. */
const WOBBLE = [[0.030, 0.9], [-0.036, 2.2], [0.024, 4.1], [-0.028, 0.3], [0.034, 3.0], [-0.022, 1.6]];
const wobbleAt = (w, th) => { const [amp, ph] = WOBBLE[w % WOBBLE.length]; return amp * Math.sin(th*1.0 + ph) * (1 + Math.sin(th)) / 2; };

function bandGeometry(zi, tubeScale, w){
  const SEG = 180, RAD = 20;
  const wob = (typeof w === 'number') ? th => wobbleAt(w, th) : () => 0;
  const pos = [], idx = [], uvs = [];
  const ct = new THREE.Vector3(), tan = new THREE.Vector3(),
        radial = new THREE.Vector3(), B = new THREE.Vector3(), N = new THREE.Vector3();
  const sq = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);   // superellipse: a touch flattened
  for (let i = 0; i <= SEG; i++){
    const th = i/SEG * Math.PI*2;
    ct.set(R*Math.cos(th), R*Math.sin(th), zi*spreadAt(th) + wob(th));
    tan.set(-R*Math.sin(th), R*Math.cos(th), zi*spreadSlope(th) + (wob(th + 0.01) - wob(th - 0.01)) / 0.02).normalize();
    radial.set(Math.cos(th), Math.sin(th), 0);
    B.crossVectors(tan, radial).normalize();
    N.crossVectors(B, tan).normalize();
    const k = TUBE * (tubeScale || 1) * tubeAt(th);
    const rA = k * RIB_W, rR = k * RIB_T;
    for (let j = 0; j <= RAD; j++){
      const ph = j/RAD * Math.PI*2;
      const a = rR * sq(Math.cos(ph), 0.9), b = rA * sq(Math.sin(ph), 0.9);
      pos.push(
        ct.x + a*N.x + b*B.x,
        ct.y + a*N.y + b*B.y,
        ct.z + a*N.z + b*B.z
      );
      uvs.push(i/SEG * 34, j/RAD * 2);
    }
  }
  for (let i = 0; i < SEG; i++){
    for (let j = 0; j < RAD; j++){
      const a = i*(RAD+1)+j, b = a+RAD+1;
      idx.push(a, b, a+1, b, b+1, a+1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* The solder join at the back: a low solid fill between the bunched wires
   from roughly 7 o'clock to 5 o'clock, so the wraps read as one band there
   (the wire crowns still stand proud of it, like fused wire). */
function joinGeometry(halfSpan){
  const A = THREE.MathUtils.degToRad(205), Bg = THREE.MathUtils.degToRad(335);
  const SEG = 72, RAD = 16;
  const pos = [], idx = [], uvs = [];
  const ct = new THREE.Vector3(), tan = new THREE.Vector3(),
        radial = new THREE.Vector3(), Bv = new THREE.Vector3(), N = new THREE.Vector3();
  const smooth = x => { x = THREE.MathUtils.clamp(x, 0, 1); return x*x*(3-2*x); };
  const sq = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);
  for (let i = 0; i <= SEG; i++){
    const th = A + (Bg - A) * i/SEG;
    const f = smooth(i/SEG / 0.22) * smooth((1 - i/SEG) / 0.22);   // fades in and out under the wires
    ct.set(R*Math.cos(th), R*Math.sin(th), 0);
    tan.set(-Math.sin(th), Math.cos(th), 0);
    radial.set(Math.cos(th), Math.sin(th), 0);
    Bv.crossVectors(tan, radial).normalize();
    N.crossVectors(Bv, tan).normalize();
    const k = TUBE * tubeAt(th);
    const rA = halfSpan * spreadAt(th) + k * 0.9;             // out to the outer wires
    const rR = k * (0.35 + 0.55 * f);                          // sits just below the wire crowns
    for (let j = 0; j <= RAD; j++){
      const ph = j/RAD * Math.PI*2;
      const a = rR * sq(Math.cos(ph), 0.6), b = rA * sq(Math.sin(ph), 0.6);
      pos.push(ct.x + a*N.x + b*Bv.x, ct.y + a*N.y + b*Bv.y, ct.z + a*N.z + b*Bv.z);
      uvs.push(i/SEG * 12, j/RAD * 2);
    }
  }
  for (let i = 0; i < SEG; i++){
    for (let j = 0; j < RAD; j++){
      const a = i*(RAD+1)+j, b = a+RAD+1;
      idx.push(a, b, a+1, b, b+1, a+1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

let ringGroup = null;
let gemHandles = [];   // {mesh set, obj, idx, zi}
let bandHandles = [];  // {mesh, idx}

function buildStone(parent, mi, scale, theta, zi, outlineKey, snug, wrapIndex){
  const g = new THREE.Group();
  const mat = gemMaterial(mi);
  const gem = new THREE.Mesh(GEOMS[outlineKey || 'round'], mat);
  gem.castShadow = true;
  gem.scale.setScalar(scale);
  g.add(gem);
  // 4 small claw prongs, set on the diagonals like her tiny heads
  const o = OUTLINES[outlineKey || 'round'];
  const span = o.reduce((m, p) => Math.max(m, Math.abs(p[0])), 0);
  const spanZ = o.reduce((m, p) => Math.max(m, Math.abs(p[1])), 0);
  const d = Math.SQRT1_2;
  for (const [px, pz] of [[span*d,spanZ*d],[-span*d,spanZ*d],[span*d,-spanZ*d],[-span*d,-spanZ*d]]){
    const pr = new THREE.Mesh(prongGeom, metalMats[metal]);
    pr.scale.set(scale*0.15, scale*0.30, scale*0.15);
    pr.position.set(px*scale*1.0, scale*0.06, pz*scale*1.0);
    pr.castShadow = true;
    g.add(pr);
  }
  // small open seat under the stone
  const seat = new THREE.Mesh(new THREE.CylinderGeometry(scale*0.5, scale*0.34, scale*0.42, 12, 1, true), metalMatsDS[metal]);
  seat.position.y = -scale*0.52;
  g.add(seat);
  // place on band: radial out at theta, gem up = radial direction
  const dir = new THREE.Vector3(Math.cos(theta), Math.sin(theta), 0);
  // bottom statement stones sit low and snug on their band, like her photos
  g.position.copy(dir).multiplyScalar(snug ? R + TUBE*0.3 + scale*0.16 : R + TUBE*0.55 + scale*0.28);
  g.position.z = zi * spreadAt(theta) + (typeof wrapIndex === 'number' ? wobbleAt(wrapIndex, theta) : 0);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  if (snug && snug.turn) g.rotateY(Math.PI/2);
  if (snug && snug.tilt) g.rotateY(snug.tilt);
  parent.add(g);
  return g;
}

function renderScene(){
  if (ringGroup){ scene.remove(ringGroup); ringGroup.traverse(o => { if (o.geometry && !Object.values(GEOMS).includes(o.geometry) && o.geometry !== prongGeom) o.geometry.dispose(); }); }
  ringGroup = new THREE.Group();
  gemHandles = [];
  bandHandles = [];

  // The chosen wraps, plus the bottom wrap for the statement stones when it's on.
  const total = wraps.length + (feature.on ? 1 : 0);
  const spacing = 0.21;   // wire-to-wire pitch across the face: close, like her photo
  const z0 = -((total-1)*spacing)/2;

  // the fused join at the back (only once there is something to join)
  if (total > 1){
    const join = new THREE.Mesh(joinGeometry(((total-1)*spacing)/2), metalMats[metal]);
    join.castShadow = true;
    ringGroup.add(join);
  }

  // which wrap is selected? (for the halo)
  let selWrap = -1;
  if (typeof selected === 'string' && selected.startsWith('f') && feature.on) selWrap = total - 1;
  else if (typeof selected === 'number') selWrap = selected;

  for (let w = 0; w < total; w++){
    const zi = z0 + w*spacing;
    const band = new THREE.Mesh(bandGeometry(zi, 1, w), metalMats[metal]);
    band.castShadow = true;
    band.userData.wrap = w;
    ringGroup.add(band);
    bandHandles.push({mesh:band, wrap:w});
    if (w === selWrap){
      const halo = new THREE.Mesh(bandGeometry(zi, 1.6, w),
        new THREE.MeshBasicMaterial({color:0xA9843F, transparent:true, opacity:0.18, depthWrite:false}));
      ringGroup.add(halo);
    }

    if (feature.on && w === total - 1){
      const pos = BOTTOM_POS[Math.min(feature.stones.length, MAX_BOTTOM)] || [];
      feature.stones.forEach((bs, j) => {
        const scale = FEATURE_CARATS[bs.size].scale;
        const m = buildStone(ringGroup, bs.month, scale, tTheta(pos[j] ?? 0.48), zi, bs.shape,
          {turn: bs.turn, tilt: [-0.16, 0.14, -0.1][j % 3]}, w);   // her stones sit a touch off-axis
        gemHandles.push({root:m, idx:'f' + j});
      });
      continue;
    }
    const st = wraps[w] && wraps[w].stone;
    if (!st) continue;
    const scale = STONE_CARATS[stoneCarat].scale;
    const theta = tTheta(PLACEMENT[w % PLACEMENT.length]);
    if (st.twin){
      const dth = (scale*2.3) / R;
      gemHandles.push({root: buildStone(ringGroup, st.month, scale, theta - dth/2, zi, null, null, w), idx: w});
      gemHandles.push({root: buildStone(ringGroup, twinMonth(st), scale, theta + dth/2, zi, null, null, w), idx: w});
    } else {
      gemHandles.push({root: buildStone(ringGroup, st.month, scale, theta, zi, null, null, w), idx: w});
    }

  frameCamera(total, spacing);
  requestRender();

/* camera orbit */
let azim = 0, elev = 1.12, dist = 7;   // looking at the face of the ring, like her photos
// #back / #side open on the join at the back, or the profile (handy for sharing a view)
if (/back/.test(location.hash)) { azim = Math.PI; elev = 0.55; }
else if (/side/.test(location.hash)) { azim = Math.PI/2; elev = 0.35; }
let azimTarget = azim;
function frameCamera(count, spacing){
  const width = count*spacing + 0.3;
  dist = 4.6 + width*1.12;
  positionCamera();
}
function positionCamera(){
  camera.position.set(
    Math.sin(azim)*Math.cos(elev)*dist,
    Math.sin(elev)*dist*0.9,
    Math.cos(azim)*Math.cos(elev)*dist
  );
  camera.lookAt(0, 0.12, 0);
  requestRender();
}

/* render-on-demand (+ eased camera turns) */
let needsRender = false;
let warmup = 90;   // render every frame briefly after load, so the first paint always lands
function requestRender(){ needsRender = true; }
function tick(){
  if (Math.abs(azimTarget - azim) > 0.002){
    azim += (azimTarget - azim) * 0.12;
    positionCamera();
  }
  if (needsRender || warmup > 0){
    renderer.render(scene, camera);
    needsRender = false;
    if (warmup > 0) warmup--;
  }
  requestAnimationFrame(tick);
}
tick();

function resize(){
  const box = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(10, box.width), hh = Math.max(10, box.height);
  renderer.setSize(w, hh, false);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

}

/* ============================ 5. INTERACTION ============================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function setPointer(e){
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left)/r.width)*2 - 1;
  pointer.y = -((e.clientY - r.top)/r.height)*2 + 1;
}
/* Stones are fixed in place (her design). Clicking selects; dragging turns the ring. */
let dragging = null; // {x, y}
canvas.addEventListener('pointerdown', e => {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const gemMeshes = [];
  gemHandles.forEach(hd => hd.root.traverse(o => { if (o.isMesh){ o.userData.handle = hd; gemMeshes.push(o); } }));
  const hit = raycaster.intersectObjects(gemMeshes, false)[0];
  if (hit){
    selected = hit.object.userData.handle.idx;

  canvas.setPointerCapture(e.pointerId);

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  azim += (e.clientX - dragging.x)*0.006;   // free spin, all the way around
  azimTarget = azim;
  elev = THREE.MathUtils.clamp(elev + (dragging.y - e.clientY)*0.004, 0.08, 1.45);

function endDrag(){
  if (!dragging) return;
  dragging = null;

}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ============================ render root ============================ */
/* ============================ studio photos ============================

const STUDIO = {y:'gold', r:'rose', w:'silver'};

  2:{wraps:[{x:291,y:354,r:51,m:7},{x:650,y:450,r:49,m:10}], bottom:{x:460,y:618,w:118,h:138,m:3}},
  3:{wraps:[{x:588,y:258,r:46,m:1},{x:290,y:358,r:51,m:7},{x:651,y:495,r:50,m:10}], bottom:{x:459,y:662,w:114,h:136,m:3}},
  4:{wraps:[{x:227,y:163,r:41,m:0},{x:587,y:290,r:45,m:1},{x:304,y:468,r:42,m:7},{x:707,y:557,r:41,m:10}], bottom:{x:472,y:714,w:140,h:102,m:3}},
  5:{wraps:[{x:456,y:103,r:42,m:6},{x:229,y:222,r:40,m:0},{x:587,y:349,r:45,m:1},{x:306,y:527,r:42,m:7},{x:708,y:618,r:40,m:10}], bottom:{x:472,y:770,w:140,h:104,m:3}},

let view = 'photo';
const photoImgs = {};          // src -> HTMLImageElement
const metalBase = {};          // src|metal -> canvas with the metal tinted

/* turn one gold pixel into rose gold or silver (backdrop, highlights and shadows stay) */
function tintGoldPixel(d, i, m){
  const r = d[i], g = d[i+1], b = d[i+2];
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx ? (mx - mn) / mx : 0;
  if (sat < 0.06 || r < b) return;
  const amt = Math.min(1, (sat - 0.06) / 0.18);

  const t = m === 'w' ? [L*0.97 + 6, L*0.985 + 6, L*1.02 + 8]                 // cool polished silver

  d[i]   = r + (t[0] - r) * amt;

/* Metal: real photos where they exist; otherwise recolour the gold pixels.

function tintedBase(src, img, m, n){
  const key = src + '|' + m;
  if (metalBase[key]) return metalBase[key];
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d', {willReadFrequently:true});
  x.drawImage(img, 0, 0);
  {
    // lift the studio backdrop to pure white so the photo sits on the page with no grey box
    const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
    for (let i = 0; i < d.length; i += 4){
      const mn = Math.min(d[i], d[i+1], d[i+2]), mx = Math.max(d[i], d[i+1], d[i+2]);
      if (mn > 222 && mx - mn < 14){

        d[i] += (255 - d[i]) * t; d[i+1] += (255 - d[i+1]) * t; d[i+2] += (255 - d[i+2]) * t;
      }
    }
    x.putImageData(id, 0, 0);
  }
  if (m !== 'y' && !STUDIO_READY[m].includes(n)){
    const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
    const P = PHOTO_STONES[n], k = c.width / 900;
    const holes = P.wraps.map(s => [s.x*k, s.y*k, s.r*k*0.96]);
    const bx = P.bottom.x*k, by = P.bottom.y*k, bw = P.bottom.w*k*0.42, bh = P.bottom.h*k*0.42;
    for (let y = 0; y < c.height; y++){
      for (let xx = 0; xx < c.width; xx++){
        let skip = false;
        if (Math.abs(xx - bx) < bw && Math.abs(y - by) < bh) skip = true;
        else for (const [hx, hy, hr] of holes){ if ((xx-hx)*(xx-hx) + (y-hy)*(y-hy) < hr*hr){ skip = true; break; } }
        if (skip) continue;
        const i = (y*c.width + xx)*4, r = d[i], g = d[i+1], b = d[i+2];
        tintGoldPixel(d, i, m);
      }
    }
    x.putImageData(id, 0, 0);
  }
  return (metalBase[key] = c);
}

/* Paint a stone's facets in a new colour: keep the photo's light and dark
   pattern, map it onto the birthstone's own dark → mid → light ramp. */
function stoneRamp(mi){
  const mo = MONTHS[mi], c = hexRgb(mo.c), d = hexRgb(mo.d);
  const light = (c[0] + c[1] + c[2]) / 3 > 215;      // diamond, pearl, opal
  return light
    ? [[0, [112,118,128]], [0.40, d], [0.78, c], [1, [255,255,255]]]
    : [[0, d.map(v => v*(0.42 + 0.33*Math.max(0, Math.min(1, ((c[0]+c[1]+c[2])/3 - 120) / 90))))], [0.38, d], [0.72, c], [1, mix(c, [255,255,255], 0.62)]];
}

  for (let i = 1; i < stops.length; i++){

      return mix(c0, c1, (t - t0) / (t1 - t0));

/* each birthstone as a hue, a saturation, a mid lightness and how much its facets swing */
const STONE_LOOK = {
  0:{h:350, s:.72, l:.28, range:.42},  // garnet — deep wine red
  1:{h:278, s:.55, l:.48, range:.50},  // amethyst
  2:{h:188, s:.45, l:.74, range:.38},  // aquamarine — pale sea blue
  3:{h:215, s:.06, l:.80, range:.62},  // diamond
  4:{h:150, s:.70, l:.36, range:.44},  // emerald
  5:{h:38,  s:.25, l:.90, range:.18},  // pearl
  6:{h:345, s:.85, l:.40, range:.46},  // ruby
  7:{h:78,  s:.62, l:.55, range:.44},  // peridot
  8:{h:224, s:.75, l:.32, range:.46},  // sapphire
  9:{h:290, s:.18, l:.86, range:.30},  // opal
  10:{h:38, s:.86, l:.52, range:.46},  // citrine
  11:{h:200, s:.70, l:.58, range:.46}, // blue topaz

function stoneHSL(mi){ return STONE_LOOK[mi]; }

  if (hp < 1){ r = c; g = x; } else if (hp < 2){ r = x; g = c; } else if (hp < 3){ g = c; b = x; }
  else if (hp < 4){ g = x; b = c; } else if (hp < 5){ r = x; b = c; } else { r = c; b = x; }
  const m = l - c/2;
  return [(r+m)*255, (g+m)*255, (b+m)*255];

function recolor(ctx, w, h, insideAt, mi){

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = (y*w + x)*4;
    A[y*w + x] = insideAt(x, y, d[i], d[i+1], d[i+2]);
  }
  const inside = (x, y) => A[y*w + x];
  const Ls = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (inside(x, y) > 0.5){ const i = (y*w + x)*4; Ls.push(0.30*d[i] + 0.59*d[i+1] + 0.11*d[i+2]); }
  }
  if (!Ls.length) return;
  Ls.sort((a, b) => a - b);
  const lo = Ls[Math.floor(Ls.length*0.03)], hi = Ls[Math.floor(Ls.length*0.985)], span = Math.max(24, hi - lo);
  const tgt = stoneHSL(mi);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const a = inside(x, y);
    if (a <= 0) continue;
    const i = (y*w + x)*4, L = 0.30*d[i] + 0.59*d[i+1] + 0.11*d[i+2];
    const l = Math.max(0, Math.min(1, (L - lo) / span));            // this facet's brightness within the stone
    // facets: dark pavilion, body colour, bright table; the top sparkle goes nearly white like a real gem
    let lightness = tgt.l + (l - 0.5) * tgt.range;
    const spark = smooth(0.86, 1.0, l);

    else if (mx === g) hue = 60 * ((b - r) / (mx - mn) + 2);

  if (mx < 120) return 0;                // dark shadow in the setting stays as it is
  if (sat > 0.66 && mx > 150) return 1;  // bright saturated orange is citrine, not gold

/* ---------- take a stone out: carry the wire across the spot ----------

function eraseStone(ctx, out, cx, cy, hw, hh){

  const yL = wireYAt(out, x0 - 3, cy, hh*0.8), yR = wireYAt(out, x1 + 3, cy, hh*0.8);
  const follow = yL != null && yR != null;
  const col = (x, y) => { y = Math.max(0, Math.min(H - 1, Math.round(y))); const o = (y*W + x)*4; return [src[o], src[o+1], src[o+2]]; };
  const avg3 = (xa, y, dir) => { const a = col(xa, y), b = col(xa + dir, y), c = col(xa + 2*dir, y); return [(a[0]+b[0]+c[0])/3, (a[1]+b[1]+c[1])/3, (a[2]+b[2]+c[2])/3]; };
  const bgMin = metal === 'w' ? 236 : 188;   // bright silver wire is close to white, so be stricter
  const isBg = c => Math.min(c[0], c[1], c[2]) > bgMin && Math.max(c[0], c[1], c[2]) - Math.min(c[0], c[1], c[2]) < 22;
  for (let y = y0; y <= y1; y++){
    for (let x = x0; x <= x1; x++){
      const t = (x - x0) / (x1 - x0 || 1), s = t*t*(3 - 2*t);
      const yc = follow ? yL + (yR - yL) * s : cy;
      const L = avg3(x0 - 1, follow ? y + (yL - yc) : y, -1);
      const R = avg3(x1 + 1, follow ? y + (yR - yc) : y, 1);
      const bgL = isBg(L), bgR = isBg(R);
      let A = L, Bc = R, f = s;
      if (bgL !== bgR){                                   // the wire stops on one side: end it cleanly
        const cut = bgL ? cx - hw*0.45 : cx + hw*0.45;
        f = smooth(cut - 3, cut + 3, x);
        if (bgL) A = [255,255,255]; else Bc = [255,255,255];
      }
      const i = ((y - y0)*bw + (x - x0))*4;
      d[i]   = A[0] + (Bc[0] - A[0]) * f;
      d[i+1] = A[1] + (Bc[1] - A[1]) * f;
      d[i+2] = A[2] + (Bc[2] - A[2]) * f;
      const e = Math.max(Math.abs(x - cx) / hw, Math.abs(y - cy) / hh);
      d[i+3] = Math.round(255 * (1 - smooth(0.84, 1.0, e)));
    }
  }
  const p = document.createElement('canvas'); p.width = bw; p.height = bh;
  p.getContext('2d').putImageData(patch, 0, 0);
  ctx.drawImage(p, x0, y0);
  out.__v = (out.__v || 0) + 1;
}

/* ---------- round top stones: recolour and resize in place ---------- */
function paintRound(ctx, base, k, s, mi, scale, dest){
  if (!dest && mi === s.m && scale === 1) return;
  const half = s.r*1.55*k, pw = Math.ceil(half*2);
  const p = document.createElement('canvas'); p.width = p.height = pw;
  const px = p.getContext('2d', {willReadFrequently:true});
  px.drawImage(base, s.x*k - half, s.y*k - half, pw, pw, 0, 0, pw, pw);
  const R0 = s.r*k;
  if (mi !== s.m){
    // the stone's own colour, read from its centre, decides which rim pixels belong to it
    const id0 = px.getImageData(0, 0, pw, pw).data, hs = [], ss = [];
    for (let y = 0; y < pw; y += 2) for (let x = 0; x < pw; x += 2){
      if (Math.hypot(x - half, y - half) > R0*0.6) continue;
      const o = (y*pw + x)*4, [hh, sat, mx] = hueSat(id0[o], id0[o+1], id0[o+2]);
      if (sat > 0.2 && mx > 50){ hs.push(hh); ss.push(sat); }
    }
    hs.sort((a, b) => a - b); ss.sort((a, b) => a - b);
    const h0 = hs.length ? hs[hs.length >> 1] : null, s0 = ss.length ? ss[ss.length >> 1] : 0;
    const stoneLike = (r, g, b) => {
      if (h0 == null) return 0;
      const [hh, sat, mx] = hueSat(r, g, b);
      const dh = Math.min(Math.abs(hh - h0), 360 - Math.abs(hh - h0));
      return dh < 18 && sat > Math.max(0.35, s0*0.7) && mx > 60 ? 1 : 0;
    };
    recolor(px, pw, pw, (x, y, r, g, b) => {
      const dd = Math.hypot(x - half, y - half);
      const core = 1 - smooth(R0*0.84, R0*0.96, dd);
      const rim = dd < R0*1.16 ? stoneLike(r, g, b) * (1 - smooth(R0*1.06, R0*1.16, dd)) : 0;
      return Math.max(core, rim);
    }, mi);
  }
  clearBackdrop(px, pw, pw, (x, y) => Math.hypot(x - half, y - half) < R0);
  // keep only the stone and its prongs, so no stray wire travels with it
  const id = px.getImageData(0, 0, pw, pw), d = id.data;
  for (let y = 0; y < pw; y++) for (let x = 0; x < pw; x++){
    d[(y*pw + x)*4 + 3] *= 1 - smooth(R0*1.20, R0*1.36, Math.hypot(x - half, y - half));
  }
  px.putImageData(id, 0, 0);
  const dx = dest ? dest.x : s.x*k, dy = dest ? dest.y : s.y*k;
  ctx.drawImage(p, dx - half*scale, dy - half*scale, pw*scale, pw*scale);
}

/* ---------- bottom stones: real photographed cuts, laid on the bottom wire ----------
   Each sprite is cut from a studio photo of this ring (the 5-wrap shot) with that
   cut on the bottom wire; bw/bh = the stone's body in sprite pixels. */
const SPRITES = {
  // bw/bh = the stone's body in sprite pixels; norm brings each cut to the same 0.5 ct footprint
  'emerald-h':{src:'img/studio/bottom/emerald-h.png', bw:140, bh:104, norm:1},
  'emerald-v':{src:'img/studio/bottom/emerald-v.png', bw:135, bh:160, norm:0.88},
  'oval-v':   {src:'img/studio/bottom/oval-v.png',    bw:140, bh:192, norm:0.80},
  'pear-v':   {src:'img/studio/bottom/pear-v.png',    bw:150, bh:200, norm:0.75},
  'heart-v':  {src:'img/studio/bottom/heart-v.png',   bw:160, bh:165, norm:0.86},
  'oval-h':   {src:'img/studio/bottom/oval-h.png',    bw:182, bh:142, norm:0.80},
  'pear-h':   {src:'img/studio/bottom/pear-h.png',    bw:176, bh:142, norm:0.80},
};
const spriteImgs = {};
function spriteFor(shape, turn){
  // the photographed cut; if the sideways one isn't there, turn the upright one
  let key = shape + '-' + (turn ? 'h' : 'v'), rot = false;
  if (!SPRITES[key]){ key = shape + '-' + (turn ? 'v' : 'h'); rot = true; }
  const sp = SPRITES[key];
  if (!sp) return null;
  if (!spriteImgs[key]){
    const im = new Image(); im.src = sp.src; spriteImgs[key] = im;
    im.decode().then(() => renderPhoto()).catch(() => {});
  }
  const im = spriteImgs[key];
  if (!(im.complete && im.naturalWidth)) return null;
  return rot ? {img:im, ...sp, bw:sp.bh, bh:sp.bw, rot:true} : {img:im, ...sp};
}
function paintSprite(ctx, sp, cx, cy, scale, mi){
  const iw = sp.img.naturalWidth, ih = sp.img.naturalHeight;
  const pw = sp.rot ? ih : iw, ph = sp.rot ? iw : ih;
  const p = document.createElement('canvas'); p.width = pw; p.height = ph;
  const px = p.getContext('2d', {willReadFrequently:true});
  if (sp.rot){ px.translate(pw, 0); px.rotate(Math.PI/2); px.drawImage(sp.img, 0, 0); px.setTransform(1, 0, 0, 1, 0, 0); }
  else px.drawImage(sp.img, 0, 0);
  if (metal !== 'y'){
    const id0 = px.getImageData(0, 0, pw, ph), d0 = id0.data;
    for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++){
      if (((x - pw/2) / (sp.bw*0.47))**2 + ((y - ph/2) / (sp.bh*0.47))**2 < 1) continue;   // leave the stone itself
      tintGoldPixel(d0, (y*pw + x)*4, metal);
    }
    px.putImageData(id0, 0, 0);
  }
  const inBody = (x, y) => ((x - pw/2) / (sp.bw*0.5))**2 + ((y - ph/2) / (sp.bh*0.5))**2 < 1;
  if (mi !== 3) recolor(px, pw, ph, (x, y, r, g, b) => {
    const e = ((x - pw/2) / (sp.bw*0.52))**2 + ((y - ph/2) / (sp.bh*0.52))**2;
    return e < 1 ? Math.max(1 - smooth(0.55, 0.8, e), notMetal(r, g, b)) * (1 - smooth(0.85, 1, e)) : 0;
  }, mi);
  clearBackdrop(px, pw, ph, inBody);
  // keep only the stone and the prongs that hold it: a rounded-box mask just outside the body
  const id = px.getImageData(0, 0, pw, ph), d = id.data;
  const P = sp.pow || 4, ax = sp.bw*0.64, ay = sp.bh*0.64;
  for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++){
    const v = Math.pow(Math.abs(x - pw/2) / ax, P) + Math.pow(Math.abs(y - ph/2) / ay, P);
    d[(y*pw + x)*4 + 3] *= 1 - smooth(0.80, 1.0, v);
  }
  px.putImageData(id, 0, 0);
  const s = scale * sp.norm;
  ctx.drawImage(p, cx - pw*s/2, cy - ph*s/2, pw*s, ph*s);
}
/* ---------- swatches cut from the photo itself, so the pickers look like the real thing ---------- */
const SWATCH = {ready:false, stones:{}, metals:{}};
function buildSwatches(){
  if (SWATCH.ready) return;
  const src = 'img/studio/gold-5.jpg', img = loadPhoto(src);
  if (!img) return;
  const k = img.naturalWidth / 900;
  const s = {x:587, y:349, r:45, m:1};                       // the amethyst on the 5-wrap photo
  const gold = tintedBase(src, img, 'y', 5);
  const R = s.r * k, side = Math.ceil(R*2);
  for (let mi = 0; mi < 12; mi++){
    const c = document.createElement('canvas'); c.width = c.height = side;
    const cx = c.getContext('2d', {willReadFrequently:true});
    cx.drawImage(gold, s.x*k - R, s.y*k - R, side, side, 0, 0, side, side);
    if (mi !== s.m) recolor(cx, side, side, (x, y) => 1 - smooth(R*0.80, R*0.95, Math.hypot(x - R, y - R)), mi);
    const o = document.createElement('canvas'); o.width = o.height = 56;
    const ox = o.getContext('2d');
    ox.beginPath(); ox.arc(28, 28, 28, 0, Math.PI*2); ox.clip();
    ox.drawImage(c, R - R*0.80, R - R*0.80, R*1.6, R*1.6, 0, 0, 56, 56);
    SWATCH.stones[mi] = o.toDataURL('image/png');
  }
  for (const m of ['y','r','w']){
    const real = m !== 'y' && STUDIO_READY[m].includes(5);
    const msrc = real ? 'img/studio/' + STUDIO[m] + '-5.jpg' : src, mimg = real ? loadPhoto(msrc) : img;
    if (!mimg) return;                                       // try again once that photo has loaded
    const base = tintedBase(msrc, mimg, m, 5);
    const o = document.createElement('canvas'); o.width = o.height = 64;
    const ox = o.getContext('2d');
    ox.beginPath(); ox.arc(32, 32, 32, 0, Math.PI*2); ox.clip();
    const w = 30*k;
    ox.drawImage(base, 700*k - w, 352*k - w, w*2, w*2, 0, 0, 64, 64);
    SWATCH.metals[m] = o.toDataURL('image/png');
  }
  SWATCH.ready = true;
  renderEditor();
}
function photoFor(){
  const n = Math.min(Math.max(wraps.length, 1), MAX_WRAPS);
  const real = STUDIO_READY[metal].includes(n);
  return {n, real, src:'img/studio/' + STUDIO[real ? metal : 'y'] + '-' + n + '.jpg'};
}
function renderPhoto(){
  const stage = $('.stage');
  stage.classList.toggle('is-photo', view === 'photo');
  document.querySelectorAll('.viewseg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  if (view !== 'photo') return;
  fitPhoto();
  const {n, src} = photoFor();
  const img = loadPhoto(src);
  const cv = $('#photoCanvas');
  if (!img) return;                                   // renderPhoto runs again once it loads
  if (!SWATCH.ready) setTimeout(buildSwatches, 0);
  if (cv.width !== img.naturalWidth){ cv.width = img.naturalWidth; cv.height = img.naturalHeight; }
  const ctx = cv.getContext('2d', {willReadFrequently:true});
  const base = tintedBase(src, img, metal, n);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(base, 0, 0);
  cv.__v = (cv.__v || 0) + 1;
  const k = cv.width / 900, P = PHOTO_STONES[n];
  const avoid = P.wraps.map(s => [s.x*k, s.y*k, s.r*k*1.5]);
  const B = P.bottom, bLong = Math.max(B.w, B.h), photoScale = bLong / 140;
  avoid.push([B.x*k, B.y*k, bLong*k*0.75]);

  // top wraps: plain wraps lose their stone, the rest take the chosen stone and carat
  const topScale = STONE_CARATS[stoneCarat].scale / STONE_CARATS.c05.scale;
  P.wraps.forEach((s, i) => {
    const st = wraps[i] && wraps[i].stone;
    if (!st) eraseStone(ctx, cv, s.x*k, s.y*k, s.r*1.9*k, s.r*1.7*k);
  });
  // bottom wire — take the photo's own stone out first, before anything new is painted nearby
  const origSideways = B.w > B.h;
  const stones = feature.on ? feature.stones : [];
  const same = stones.length === 1 && stones[0].shape === 'emerald' && Boolean(stones[0].turn) === origSideways;
  if (!same) eraseStone(ctx, cv, B.x*k, B.y*k, B.w*0.80*k, B.h*0.95*k);

  // top stones
  P.wraps.forEach((s, i) => {
    const st = wraps[i] && wraps[i].stone;
    if (!st) return;
    paintRound(ctx, base, k, s, st.month, topScale);
    if (st.twin){
      // the twin sits beside it on the same wire, toward the middle of the ring
      const dir = s.x < 450 ? 1 : -1, gapX = s.r * 2.7 * Math.max(1, topScale*0.92);
      const tx = (s.x + dir*gapX) * k;
      const yA = wireYAt(cv, (s.x + dir*s.r*1.75)*k, s.y*k, s.r*k), yB = wireYAt(cv, tx, s.y*k, s.r*1.2*k);
      const ty = s.y*k + (yA != null && yB != null ? yB - yA : 0);
      paintRound(ctx, base, k, s, twinMonth(st), topScale, {x:tx, y:ty});
    }
  });


  if (same){
    const bs = stones[0], sc = FEATURE_CARATS[bs.size].scale / FEATURE_CARATS.c50.scale;
    paintEmeraldInPlace(ctx, base, k, B, bs.month, sc);
  } else {
    const sprites = stones.map(bs => spriteFor(bs.shape, bs.turn));
    if (stones.length && sprites.every(Boolean)){
      let scales = stones.map(bs => photoScale * k * FEATURE_CARATS[bs.size].scale / FEATURE_CARATS.c50.scale);
      let widths = sprites.map((sp, i) => sp.bw * sp.norm * scales[i]);
      const x0 = B.x*k, y0 = B.y*k;
      // follow the bottom wire both ways from the stone's spot to find how much wire there is
      const trace = dir => {
        let x = x0, y = y0, last = x0;
        for (let step = 0; step < 120; step++){
          x += dir * 6*k;
          const yw = wireYAt(cv, x, y, 26*k);
          if (yw == null) break;
          y = yw; last = x;
        }
        return last;
      };
      const leftEnd = trace(-1), rightEnd = trace(1);
      let gap = 22 * k;
      let total = widths.reduce((a, b) => a + b, 0) + gap * (stones.length - 1);
      const room = Math.max(widths[0], (rightEnd - leftEnd) - 20*k);
      if (total > room){                       // smaller stones when several share the wire
        const f = room / total;
        scales = scales.map(s => s * f); widths = widths.map(w => w * f); gap *= f; total = room;
      }
      let left = Math.max(leftEnd + 10*k, Math.min(x0 - total/2, rightEnd - 10*k - total));
      if (stones.length === 1) left = x0 - widths[0]/2;
      let x = left, yPrev = y0;
      const yAtX0 = wireYAt(cv, x0, y0, 30*k);
      stones.forEach((bs, i) => {
        const cx = x + widths[i]/2;
        const yw = wireYAt(cv, cx, yPrev, 40*k);
        const cy = (yw != null && yAtX0 != null) ? y0 + (yw - yAtX0) : y0;
        if (yw != null) yPrev = yw;
        paintSprite(ctx, sprites[i], cx, cy, scales[i], bs.month);
        x += widths[i] + gap;
      });
    }
  }
  const what = n + ' wrap' + (n !== 1 ? 's' : '') + ' in ' + METALS[metal].label.toLowerCase();
  cv.setAttribute('aria-label', 'Photograph of your ring, ' + what);
}
function paintEmeraldInPlace(ctx, base, k, s, mi, scale){
  if (mi === s.m && scale === 1) return;
  const hw = s.w*0.78*k, hh = s.h*0.78*k, pw = Math.ceil(hw*2), ph = Math.ceil(hh*2);
  const p = document.createElement('canvas'); p.width = pw; p.height = ph;
  const px = p.getContext('2d', {willReadFrequently:true});
  px.drawImage(base, s.x*k - hw, s.y*k - hh, pw, ph, 0, 0, pw, ph);
  if (mi !== s.m) recolor(px, pw, ph, (x, y) => (1 - smooth(s.w*k*0.40, s.w*k*0.49, Math.abs(x - hw))) * (1 - smooth(s.h*k*0.40, s.h*k*0.49, Math.abs(y - hh))), mi);
  clearBackdrop(px, pw, ph, (x, y) => Math.abs(x - hw) < s.w*k*0.5 && Math.abs(y - hh) < s.h*k*0.5);
  featherInto(px, pw, ph, scale > 1 ? 0.80 : 0.86);
  ctx.drawImage(p, s.x*k - hw*scale, s.y*k - hh*scale, pw*scale, ph*scale);
}
document.querySelectorAll('.viewseg button').forEach(b => b.addEventListener('click', () => { view = b.dataset.view; renderPhoto(); }));
// fit the photo to its frame
function fitPhoto(){
  const f = $('#photoView'), cv = $('#photoCanvas');
  if (!f || !f.clientWidth) return;
  const top = 0, bottom = 0;
  const side = Math.max(120, Math.min(f.clientWidth, f.clientHeight - top - bottom));
  cv.style.width = cv.style.height = side + 'px';
  cv.style.marginTop = (top - bottom) + 'px';
}
new ResizeObserver(fitPhoto).observe($('.stage'));

function render(){
  renderEditor();
  renderScene();
  renderPhoto();
}

/* ============================ wiring ============================ */
$('#btnAdd').addEventListener('click', () => {
  if (wraps.length >= MAX_WRAPS) return;
  const used = new Set(wraps.filter(w => w.stone).map(w => w.stone.month));
  let month = MONTHS.findIndex((_, i) => !used.has(i));
  if (month < 0) month = Math.floor(Math.random() * 12);
  wraps.push(newWrap({stone:{month, name:'', twin:false}}));
  selected = wraps.length - 1;
  render();
});



$('#btnReset').addEventListener('click', () => { defaultDesign(); render(); });

$('#btnTurn').addEventListener('click', () => { azimTarget += Math.PI; });
$('#btnFront').addEventListener('click', () => {
  // ease back to the face of the ring
  azimTarget = Math.round(azim / (Math.PI * 2)) * Math.PI * 2;
  elev = 1.12;
  positionCamera();
});

$('#btnSurprise').addEventListener('click', () => {
  const n = 3 + Math.floor(Math.random() * 3);   // 3-5 wraps
  const months = [...Array(12).keys()].sort(() => Math.random() - .5);
  wraps = Array.from({length: n}, (_, i) => newWrap({
    stone: Math.random() < .85
      ? {month: months[i % 12], name:'', twin: false}
      : null,
  }));
  stoneCarat = ['c05','c05','c10','c15','c25'][Math.floor(Math.random()*5)];
  metal = ['y','y','r','w'][Math.floor(Math.random()*4)];
  feature.on = Math.random() < .7;
  const nb = Math.random() < .7 ? 1 : 2;
  feature.stones = Array.from({length: nb}, (_, i) => newBottomStone({
    shape: SHAPES[Math.floor(Math.random() * SHAPES.length)].id,
    month: Math.random() < .6 ? 3 : months[(n + i) % 12],
    size: ['c50','c100','c100','c150'][Math.floor(Math.random()*4)],
  }));
  selected = 0;
  render();
});

(function(){
  const sel = $('#ringSize');
  for (let s = 4; s <= 10; s += .5){
    const o = document.createElement('option');
    o.value = o.textContent = s;
    if (s === 6.5) o.selected = true;
    sel.appendChild(o);
  }
})();

$('#btnRequest').addEventListener('click', () => {
  const spec = buildSpec();
  $('#specText').textContent = spec;
  $('#btnMailto').href = 'mailto:sales@pkhartjewels.com?subject=' +
    encodeURIComponent('Custom birthstone ring request') + '&body=' + encodeURIComponent(spec + '\n\nMy name:\nMy phone:');
  $('#modalBg').classList.add('open');
});
$('#btnClose').addEventListener('click', () => $('#modalBg').classList.remove('open'));
$('#modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) $('#modalBg').classList.remove('open'); });
$('#btnCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(buildSpec()); $('#btnCopy').textContent = 'Copied'; }
  catch { $('#btnCopy').textContent = 'Select the text above and copy it'; }
  setTimeout(() => { $('#btnCopy').textContent = 'Copy'; }, 1600);
});

/* reference photos: inline strip on desktop, straight to the lightbox on phones */
const refPics = [...document.querySelectorAll('.refpic')];
const isPhone = () => matchMedia('(max-width:980px)').matches;
function openLightbox(a){
  $('#lightboxImg').src = a.getAttribute('href');
  $('#lightboxImg').alt = a.querySelector('img').alt;
  $('#lightboxCap').textContent = a.dataset.cap || '';

$('#btnSave')?.addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'pkhart-birthstone-ring.png';
  if (view === 'photo') a.href = $('#photoCanvas').toDataURL('image/png');
  else { renderer.render(scene, camera); a.href = renderer.domElement.toDataURL('image/png'); }
