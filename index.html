<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PK HART — Birthstone Ring Studio</title>
<meta name="description" content="Design your PK HART birthstone wrap ring: choose the metal, the number of wraps and the stone for each one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<!--
  PK HART — BIRTHSTONE RING STUDIO

  How the preview works (no canvas, no colour filters on stones):
    - The ring is a photograph per wrap count and metal:   img/rings/<metal>/ring-<n>.jpg
      (the small stones are not in these photos; the pear diamond is part of the photo).
    - Every small stone is its own image from the Stone Bank: img/stones/<metal>/<nn>-<name>.png
      (twelve stones, identical dimensions; the metal folder only changes the four prongs).
    - Each wrap has one placement on the ring (RINGS below). The page puts the chosen
      stone's image at that placement. Changing a stone swaps the image file.

  Nothing is sent anywhere: "Request this ring" opens the visitor's own mail app.
-->

<style>
:root{
  --ink:#0B0B0B; --ink-2:#4A4A4A; --ink-3:#8A8A8A;
  --paper:#FFFFFF; --mist:#F7F6F4; --line-c:#E6E6E6; --line-2:#CCCCCC;
  --serif:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --sans:'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --ease:cubic-bezier(.2,.7,.3,1); --fast:160ms;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--serif); font-weight:400; margin:0; font-variant-numeric:lining-nums}
button,select{font-family:var(--sans); color:var(--ink)}
button{cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none !important; animation:none !important} }
[hidden]{display:none !important}

/* ---------- nav ---------- */
.nav{display:flex; align-items:center; justify-content:space-between; padding:22px 48px; border-bottom:1px solid var(--line-c)}
.wordmark{font-family:var(--serif); font-size:22px; letter-spacing:.22em; color:var(--ink); text-decoration:none}
.navlink{font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--ink); text-decoration:none}
.navlink:hover{text-decoration:underline; text-underline-offset:4px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:0;
  padding:15px 20px; font-size:11.5px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; line-height:1.2; white-space:nowrap;
  text-decoration:none; transition:background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.btn:hover{background:var(--ink); color:#fff}
.btn.solid{background:var(--ink); color:#fff}
.btn.solid:hover{background:#333; border-color:#333}
.btn.quiet{border-color:var(--line-2)}
.btn.wide{width:100%}
.link{
  border:0; background:none; padding:0; font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-2); text-decoration:underline; text-decoration-color:var(--line-2); text-underline-offset:4px;
  transition:color var(--fast) var(--ease), text-decoration-color var(--fast) var(--ease);
}
.link:hover{color:var(--ink); text-decoration-color:var(--ink)}

/* ---------- layout ---------- */
.studio{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr); min-height:calc(100vh - 70px)}
.stage-col{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 40px; border-right:1px solid var(--line-c)}
.panel{padding:44px 48px 56px 44px; max-width:580px}
@media (min-width:981px){ .stage-col{position:sticky; top:0; height:100vh} }

/* ---------- the ring preview: a photo with stone images placed on it ---------- */
.ring{position:relative; width:min(100%, calc(100vh - 150px), 720px); aspect-ratio:1/1}
.ring-img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none}
.gem{
  position:absolute; transform:translate(-50%,-50%); aspect-ratio:1/1; padding:0; border:0; background:none; border-radius:50%;
  -webkit-tap-highlight-color:transparent;
}
.gem img{position:absolute; inset:0; width:100%; height:100%; user-select:none; -webkit-user-drag:none; pointer-events:none}
.gem .seat{z-index:0}
.gem .stone-img{z-index:1; transition:transform 220ms var(--ease)}
.gem:hover .stone-img{transform:scale(1.06)}
.gem.swap .stone-img{animation:set 320ms var(--ease)}
@keyframes set{ from{transform:scale(.82); opacity:.2} to{transform:scale(1); opacity:1} }
.gem:focus-visible{outline:2px solid var(--ink); outline-offset:-14%}
.gem.empty{display:none}
.hint{margin:6px 0 0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}

/* ---------- panel ---------- */
.panel h1{font-size:44px; line-height:1.05; letter-spacing:.005em}
.lede{margin:10px 0 0; color:var(--ink-2); font-size:14px}
.opt{border-top:1px solid var(--line-c); margin-top:28px; padding-top:20px}
.opt-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase}
.opt-h .val{letter-spacing:.04em; text-transform:none; font-size:13px; font-weight:400; color:var(--ink-2)}

.metals{display:flex; gap:14px}
.metal{
  width:36px; height:36px; border-radius:50%; border:0; padding:0;
  box-shadow:0 1px 3px rgba(0,0,0,.22); outline:1px solid transparent; outline-offset:4px;
  transition:outline-color var(--fast) var(--ease);
}
.metal:hover{outline-color:var(--line-2)}
.metal[aria-pressed=true]{outline-color:var(--ink)}
.metal.y{background:radial-gradient(circle at 34% 28%, #FFF6D8 0%, #EFCB79 30%, #C89A45 68%, #9A6F25 100%)}
.metal.r{background:radial-gradient(circle at 34% 28%, #FFEDE4 0%, #EBB9A0 30%, #C98A6E 68%, #9E5F47 100%)}
.metal.w{background:radial-gradient(circle at 34% 28%, #FFFFFF 0%, #E4E6EA 30%, #B4B8C0 68%, #83878F 100%)}

.seg{display:flex; gap:6px}
.seg button{
  border:1px solid var(--line-2); background:var(--paper); width:44px; height:40px; font-size:14px;
  font-family:var(--serif); font-variant-numeric:lining-nums;
  transition:background var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink); border-color:var(--ink); color:#fff}

/* one row per wrap; the open one shows the Stone Bank */
.wraps{display:flex; flex-direction:column}
.wrap{border-bottom:1px solid var(--line-c)}
.wrap:last-child{border-bottom:0}
.wrap-head{
  width:100%; display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center; gap:14px;
  border:0; background:none; padding:12px 0; text-align:left;
}
.wrap-head .thumb{width:44px; height:44px; position:relative}
.wrap-head .thumb img{width:100%; height:100%}
.wrap-head .thumb.none{border:1px dashed var(--line-2); border-radius:50%}
.wrap-head .lbl{display:flex; flex-direction:column; line-height:1.3}
.wrap-head .lbl small{font-size:10.5px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3)}
.wrap-head .lbl span{font-family:var(--serif); font-size:19px}
.wrap-head .chev{font-size:10.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); transition:color var(--fast) var(--ease)}
.wrap-head:hover .chev{color:var(--ink)}
.wrap.open .wrap-head .chev{color:var(--ink)}
.bank{display:none; padding:2px 0 18px}
.wrap.open .bank{display:block}
.tiles{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:6px}
.tile{
  border:1px solid transparent; background:none; padding:6px 2px 5px; display:flex; flex-direction:column; align-items:center; gap:2px;
  transition:border-color var(--fast) var(--ease), background var(--fast) var(--ease);
}
.tile img{width:100%; max-width:58px; aspect-ratio:1/1; transition:transform var(--fast) var(--ease)}
.tile small{font-size:9.5px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.tile:hover{background:var(--mist)}
.tile:hover img{transform:scale(1.07)}
.tile[aria-pressed=true]{border-color:var(--ink)}
.tile[aria-pressed=true] small{color:var(--ink)}
.bank-foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px; min-height:18px}
.bank-foot .now{font-size:13px; color:var(--ink-2)}

.fixed{display:grid; grid-template-columns:44px minmax(0,1fr); align-items:center; gap:14px; padding:12px 0 0}
.fixed .pear{width:44px; height:44px; background-size:330% auto; background-repeat:no-repeat; border-radius:50%}
.fixed .lbl{display:flex; flex-direction:column; line-height:1.3}
.fixed .lbl small{font-size:10.5px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3)}
.fixed .lbl span{font-family:var(--serif); font-size:19px}

.buy{display:flex; flex-direction:column; gap:14px}
.sizebox{display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase}
.sizebox select{border:1px solid var(--line-2); border-radius:0; background:var(--paper); padding:9px 12px; font-size:14px; letter-spacing:0}

/* ---------- request modal ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; padding:24px; z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff; border:1px solid var(--ink); max-width:480px; width:100%; padding:32px; max-height:86vh; overflow:auto}
.modal h2{font-size:30px}
.spec{white-space:pre-wrap; background:var(--mist); padding:14px 16px; font-size:13px; margin:18px 0; line-height:1.65}
.modal .actions{display:flex; gap:8px; flex-wrap:wrap}

footer.pagefoot{border-top:1px solid var(--line-c); padding:22px 48px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}

/* ---------- phone ---------- */
@media (max-width:980px){
  .nav{padding:16px 20px}
  .studio{display:block}
  .stage-col{position:sticky; top:0; z-index:20; background:#fff; padding:6px 20px 8px; border-right:0; border-bottom:1px solid var(--line-c)}
  .ring{width:min(100%, 42vh)}
  .hint{display:none}
  .panel{padding:24px 20px 44px; max-width:none}
  .panel h1{font-size:34px}
  .tiles{gap:4px}
  footer.pagefoot{padding:20px}
}
</style>

<nav class="nav">
  <a class="wordmark" href="https://pkhartjewels.com">PK HART</a>
  <a class="navlink" href="mailto:sales@pkhartjewels.com">Contact</a>
</nav>

<main class="studio">
  <section class="stage-col" aria-label="Your ring">
    <div class="ring" id="ring">
      <img class="ring-img" id="ringImg" alt="">
      <!-- one stone placement per wrap; filled from the Stone Bank -->
    </div>
    <p class="hint">Select a stone on the ring to change it</p>
  </section>

  <section class="panel">
    <h1>Birthstone Ring</h1>
    <p class="lede">Made to order in 14k. One birthstone for each wrap.</p>

    <div class="opt">
      <div class="opt-h"><span>Metal</span><span class="val" id="metalLabel"></span></div>
      <div class="metals" id="metals"></div>
    </div>

    <div class="opt">
      <div class="opt-h"><span>Wraps</span><span class="val" id="countLabel"></span></div>
      <div class="seg" id="counts" role="group" aria-label="Number of wraps"></div>
    </div>

    <div class="opt">
      <div class="opt-h"><span>Birthstones</span><span class="val">Choose one for each wrap</span></div>
      <div class="wraps" id="wraps"></div>
      <div class="fixed">
        <div class="pear" id="pearThumb" role="img" aria-label="Pear diamond"></div>
        <div class="lbl"><small>Bottom wrap</small><span>Pear diamond</span></div>
      </div>
    </div>

    <div class="opt buy">
      <label class="sizebox"><span>Ring size</span><select id="ringSize"></select></label>
      <button class="btn solid wide" id="btnRequest">Request this ring</button>
    </div>
  </section>
</main>

<footer class="pagefoot">PK HART Fine Jewelry &middot; Lincolnwood, IL</footer>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Your ring</h2>
    <div class="spec" id="specText"></div>
    <div class="actions">
      <a class="btn solid" id="btnMailto" href="#">Email PK HART</a>
      <button class="btn" id="btnCopy">Copy</button>
      <button class="btn quiet" id="btnClose">Close</button>
    </div>
  </div>
</div>

<script>
/* ============================ THE STONE BANK ============================
   One entry per birth month. `file` is that stone's own image; the same file name
   exists in each metal folder (only the prongs differ). Add or replace a stone by
   dropping a new image in img/stones/<metal>/ and editing this list. */
const STONE_BANK = [
  {month:'January',   short:'Jan', name:'Garnet',          file:'01-garnet.png'},
  {month:'February',  short:'Feb', name:'Amethyst',        file:'02-amethyst.png'},
  {month:'March',     short:'Mar', name:'Aquamarine',      file:'03-aquamarine.png'},
  {month:'April',     short:'Apr', name:'Diamond',         file:'04-diamond.png'},
  {month:'May',       short:'May', name:'Emerald',         file:'05-emerald.png'},
  {month:'June',      short:'Jun', name:'Alexandrite',     file:'06-alexandrite.png'},
  {month:'July',      short:'Jul', name:'Ruby',            file:'07-ruby.png'},
  {month:'August',    short:'Aug', name:'Peridot',         file:'08-peridot.png'},
  {month:'September', short:'Sep', name:'Sapphire',        file:'09-sapphire.png'},
  {month:'October',   short:'Oct', name:'Pink Tourmaline', file:'10-pink-tourmaline.png'},
  {month:'November',  short:'Nov', name:'Citrine',         file:'11-citrine.png'},
  {month:'December',  short:'Dec', name:'Turquoise',       file:'12-turquoise.png'},
];
const METALS = {
  y:{label:'Gold',      dir:'gold'},
  r:{label:'Rose gold', dir:'rose'},
  w:{label:'Silver',    dir:'silver'},
};
const MAX_WRAPS = 5;
/* Where each wrap's stone sits on each ring photo, measured on the 900px photo:
   stones = [x, y] of the centre, top wrap first; size = the stone's radius in the photo. */
const RINGS = {
  1:{size:51.2, stones:[[442,358]]},
  2:{size:43.3, stones:[[428,313],[287,453]]},
  3:{size:41.8, stones:[[419,236],[275,373],[539,456]]},
  4:{size:42.5, stones:[[417,249],[262,363],[537,444],[325,550]]},
  5:{size:44.2, stones:[[431,208],[264,318],[539,402],[331,505],[640,582]]},
};
const PEAR = {1:[469,578], 2:[465,637], 3:[448,623], 4:[449,668], 5:[447,704]};   // for the small pear picture in the panel
const PHOTO = 900, STONE_BOX = 3;      // a stone image is 3x its stone's radius wide (300px file, 100px radius)

const stoneSrc = (i, metal) => 'img/stones/' + METALS[metal].dir + '/' + STONE_BANK[i].file;
const seatSrc  = metal => 'img/stones/' + METALS[metal].dir + '/seat.png';
const ringSrc  = (n, metal) => 'img/rings/' + METALS[metal].dir + '/ring-' + n + '.jpg';

/* ============================ STATE ============================
   picks keeps a choice for all five wraps, so removing a wrap and adding it back
   brings its stone back. null = that wrap is left without a stone. */
const STORE = 'pkhart-ring-v3';
const DEFAULTS = {metal:'y', count:5, picks:[6, 4, 1, 3, 3], open:0, size:'6.5'};
let state = load();
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (s && METALS[s.metal] && s.count >= 1 && s.count <= MAX_WRAPS && Array.isArray(s.picks) && s.picks.length === MAX_WRAPS &&
        s.picks.every(p => p === null || (Number.isInteger(p) && p >= 0 && p < STONE_BANK.length)))
      return Object.assign({}, DEFAULTS, s);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

const $ = s => document.querySelector(s);
const el = (tag, cls, parent, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; if (parent) parent.appendChild(n); return n; };
const stoneLabel = i => i == null ? 'No stone' : STONE_BANK[i].month + ' · ' + STONE_BANK[i].name;

/* ============================ THE RING PREVIEW ============================ */
const gems = [];                       // one button per wrap, reused; each holds the seat and the stone image
(function buildGems(){
  const ring = $('#ring');
  for (let i = 0; i < MAX_WRAPS; i++){
    const b = el('button', 'gem', ring); b.type = 'button';
    const seat = el('img', 'seat', b); seat.alt = '';
    const img = el('img', 'stone-img', b); img.alt = '';
    b.addEventListener('click', () => { state.open = i; save(); renderWraps(); setTimeout(() => focusWrap(i), 30); });   // scroll after the click has finished
    gems.push({b, seat, img, shown:null});
  }
})();
function renderRing(){
  const n = state.count, R = RINGS[n];
  const ringImg = $('#ringImg');
  const src = ringSrc(n, state.metal);
  if (ringImg.getAttribute('src') !== src) ringImg.src = src;
  ringImg.alt = METALS[state.metal].label + ' wrap ring with ' + n + (n === 1 ? ' wrap' : ' wraps');
  gems.forEach((g, i) => {
    const pick = state.picks[i], on = i < n && pick != null;
    g.b.classList.toggle('empty', !on);
    if (i < n){
      const [x, y] = R.stones[i];
      g.b.style.left = (x / PHOTO * 100) + '%';
      g.b.style.top = (y / PHOTO * 100) + '%';
      g.b.style.width = (R.size * STONE_BOX / PHOTO * 100) + '%';
    }
    if (!on){ g.shown = null; return; }
    const s = stoneSrc(pick, state.metal), key = s;
    if (g.shown !== key){
      const hadStone = g.shown !== null && g.shown.split('/').pop() !== s.split('/').pop();
      g.img.src = s; g.seat.src = seatSrc(state.metal); g.shown = key;
      if (hadStone){ g.b.classList.remove('swap'); void g.b.offsetWidth; g.b.classList.add('swap'); }
    }
    g.b.setAttribute('aria-label', 'Wrap ' + (i + 1) + ': ' + stoneLabel(pick) + '. Change stone');
  });
}

/* ============================ CONTROLS ============================ */
function renderMetals(){
  const box = $('#metals'); box.textContent = '';
  Object.keys(METALS).forEach(m => {
    const b = el('button', 'metal ' + m, box); b.type = 'button';
    b.setAttribute('aria-label', METALS[m].label); b.title = METALS[m].label;
    b.setAttribute('aria-pressed', String(state.metal === m));
    b.addEventListener('click', () => { state.metal = m; save(); render(); });
  });
  $('#metalLabel').textContent = METALS[state.metal].label;
}
function renderCounts(){
  const box = $('#counts'); box.textContent = '';
  for (let n = 1; n <= MAX_WRAPS; n++){
    const b = el('button', '', box, String(n)); b.type = 'button';
    b.setAttribute('aria-pressed', String(state.count === n));
    b.setAttribute('aria-label', n + (n === 1 ? ' wrap' : ' wraps'));
    b.addEventListener('click', () => {
      state.count = n;
      if (state.open >= n) state.open = n - 1;
      save(); render();
    });
  }
  $('#countLabel').textContent = state.count + (state.count === 1 ? ' wrap' : ' wraps');
}
function choose(wrap, pick){
  state.picks[wrap] = pick; save();
  renderRing(); renderWraps();
}
function renderWraps(){
  const box = $('#wraps'); box.textContent = '';
  for (let i = 0; i < state.count; i++){
    const pick = state.picks[i], open = state.open === i;
    const row = el('div', 'wrap' + (open ? ' open' : ''), box); row.id = 'wrap-' + i;
    const head = el('button', 'wrap-head', row); head.type = 'button';
    head.setAttribute('aria-expanded', String(open));
    const th = el('span', 'thumb' + (pick == null ? ' none' : ''), head);
    if (pick != null){ const im = el('img', '', th); im.src = stoneSrc(pick, state.metal); im.alt = ''; }
    const lbl = el('span', 'lbl', head);
    el('small', '', lbl, 'Wrap ' + (i + 1));
    el('span', '', lbl, stoneLabel(pick));
    el('span', 'chev', head, open ? 'Close' : 'Change');
    head.addEventListener('click', () => { state.open = open ? -1 : i; save(); renderWraps(); });

    const bank = el('div', 'bank', row);
    const tiles = el('div', 'tiles', bank);
    STONE_BANK.forEach((st, k) => {
      const t = el('button', 'tile', tiles); t.type = 'button';
      t.setAttribute('aria-pressed', String(pick === k));
      t.setAttribute('aria-label', st.month + ' ' + st.name); t.title = st.month + ' · ' + st.name;
      const im = el('img', '', t); im.src = stoneSrc(k, state.metal); im.alt = ''; im.loading = 'lazy';
      el('small', '', t, st.short);
      t.addEventListener('click', () => choose(i, k));
    });
    const foot = el('div', 'bank-foot', bank);
    el('span', 'now', foot, stoneLabel(pick));
    if (pick != null){
      const none = el('button', 'link', foot, 'Leave this wrap plain'); none.type = 'button';
      none.addEventListener('click', () => choose(i, null));
    }
  }
}
function focusWrap(i){
  const row = document.getElementById('wrap-' + i);
  if (!row) return;
  const phone = !matchMedia('(min-width:981px)').matches;
  row.style.scrollMarginTop = phone ? ($('.stage-col').offsetHeight + 8) + 'px' : '16px';   // on phones the ring stays pinned on top
  row.scrollIntoView({block: phone ? 'start' : 'nearest', behavior:'smooth'});
}
function renderPear(){
  const p = $('#pearThumb'), [x, y] = PEAR[state.count];
  p.style.backgroundImage = 'url(' + ringSrc(state.count, state.metal) + ')';
  p.style.backgroundPosition = (x / PHOTO * 100) + '% ' + (y / PHOTO * 100) + '%';
}
function render(){ renderMetals(); renderCounts(); renderRing(); renderWraps(); renderPear(); preload(); }

/* fetch the other photos and stones in the background so every change is instant */
const warmed = new Set();
function preload(){
  const list = [];
  for (let n = 1; n <= MAX_WRAPS; n++) list.push(ringSrc(n, state.metal));
  STONE_BANK.forEach((_, i) => list.push(stoneSrc(i, state.metal)));
  list.push(seatSrc(state.metal));
  list.forEach(src => { if (!warmed.has(src)){ warmed.add(src); const im = new Image(); im.src = src; } });
}

/* ============================ REQUEST ============================ */
function buildSpec(){
  const lines = ['CUSTOM BIRTHSTONE RING — design request', ''];
  lines.push('Metal: ' + METALS[state.metal].label);
  lines.push('Wraps: ' + state.count);
  for (let i = 0; i < state.count; i++)
    lines.push('Wrap ' + (i + 1) + ': ' + (state.picks[i] == null ? 'plain, no stone' : STONE_BANK[state.picks[i]].month + ' — ' + STONE_BANK[state.picks[i]].name));
  lines.push('Bottom wrap: pear diamond');
  lines.push('Ring size: ' + $('#ringSize').value);
  lines.push('', 'Designed in the PK HART Birthstone Ring Studio.');
  return lines.join('\n');
}
(function(){
  const sel = $('#ringSize');
  for (let s = 4; s <= 10; s += .5){
    const o = document.createElement('option'); o.value = o.textContent = String(s);
    if (String(s) === String(state.size)) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => { state.size = sel.value; save(); });
})();
$('#btnRequest').addEventListener('click', () => {
  const spec = buildSpec();
  $('#specText').textContent = spec;
  $('#btnMailto').href = 'mailto:sales@pkhartjewels.com?subject=' + encodeURIComponent('Custom birthstone ring request') +
    '&body=' + encodeURIComponent(spec + '\n\nMy name:\nMy phone:');
  $('#modalBg').classList.add('open');
});
const closeModal = () => $('#modalBg').classList.remove('open');
$('#btnClose').addEventListener('click', closeModal);
$('#modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#btnCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(buildSpec()); $('#btnCopy').textContent = 'Copied'; }
  catch (e) { $('#btnCopy').textContent = 'Select the text above and copy it'; }
  setTimeout(() => { $('#btnCopy').textContent = 'Copy'; }, 1600);
});

render();
</script>
</html>
